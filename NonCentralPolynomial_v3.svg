<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1280pt" height="820pt"
     viewBox="0 0 1280 820"
     version="1.1">

  <defs>
    <marker id="arrowBlack" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>

    <linearGradient id="leftSensor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a6cd8"/>
      <stop offset="100%" stop-color="#1c3f9c"/>
    </linearGradient>
    <linearGradient id="rightSensor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dc4a40"/>
      <stop offset="100%" stop-color="#9b2418"/>
    </linearGradient>

    <style type="text/css">
      .body { font-family: 'DejaVu Sans', 'Arial', sans-serif; }
      .title    { font-size: 26px; font-weight: bold; }
      .subtitle { font-size: 14px; }
      .header   { font-size: 17px; font-weight: bold; }
      .label    { font-size: 14px; }
      .small    { font-size: 12px; }
      .tiny     { font-size: 11px; }
      .it       { font-style: italic; }
      .panelfill { fill: #f5f8ff; stroke: #1f3a8a; stroke-width: 1.5; }
      .ideabox   { fill: #eaf5d6; stroke: #4d7a13; stroke-width: 1.2; }
      .warnbox   { fill: #fef3d7; stroke: #b07b15; stroke-width: 1.2; }
      .legendbox { fill: #ffffff; stroke: #888;    stroke-width: 0.8; }
      .ray-axis  { stroke: #888; stroke-width: 1; stroke-dasharray: 4 3; fill: none; }
      .blue   { fill: #2a55c7; }
      .red    { fill: #c4332a; }
      .gray   { fill: #6e6e6e; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="820" fill="#ffffff"/>

  <!-- ===== TITLE ===== -->
  <text x="640" y="40" class="body title" text-anchor="middle">
    Non-central Polynomial Channel Model
  </text>
  <text x="640" y="64" class="body subtitle" text-anchor="middle" fill="#555">
    phenomenological surrogate for off-axis stereo (e.g. CMO microscope, decentered pinhole pair)
  </text>

  <!-- ===== Channel headers ===== -->
  <text x="200" y="105" class="body header blue" text-anchor="middle">left channel  c = L</text>
  <text x="500" y="105" class="body header red"  text-anchor="middle">right channel  c = R</text>

  <!-- ===== Sensor labels ===== -->
  <text x="200" y="130" class="body small" text-anchor="middle">sensor</text>
  <text x="500" y="130" class="body small" text-anchor="middle">sensor</text>
  <text x="200" y="146" class="body small it" text-anchor="middle">(u_L, v_L)</text>
  <text x="500" y="146" class="body small it" text-anchor="middle">(u_R, v_R)</text>

  <!-- ===== Sensor rectangles ===== -->
  <rect x="155" y="153" width="90" height="10" fill="url(#leftSensor)"  stroke="#000" stroke-width="0.8"/>
  <rect x="455" y="153" width="90" height="10" fill="url(#rightSensor)" stroke="#000" stroke-width="0.8"/>

  <!-- ===== Dashed sensor support lines ===== -->
  <line x1="200" y1="163" x2="200" y2="200" class="ray-axis"/>
  <line x1="500" y1="163" x2="500" y2="200" class="ray-axis"/>

  <!-- ===== Pinhole housings ===== -->
  <path d="M 165 200 L 235 200 L 215 270 L 185 270 z"
        fill="#cfdbf5" stroke="#2a55c7" stroke-width="1.2" opacity="0.85"/>
  <path d="M 465 200 L 535 200 L 515 270 L 485 270 z"
        fill="#f5d2cf" stroke="#c4332a" stroke-width="1.2" opacity="0.85"/>

  <text x="200" y="240" class="body tiny it" text-anchor="middle">K_L</text>
  <text x="500" y="240" class="body tiny it" text-anchor="middle">K_R</text>

  <!-- ===== Baseline arrow ===== -->
  <line x1="208" y1="305" x2="492" y2="305" stroke="#000" stroke-width="1.2"
        marker-end="url(#arrowBlack)" marker-start="url(#arrowBlack)"/>

  <!-- ===== Effective origin dots ===== -->
  <circle cx="200" cy="305" r="6" fill="#2a55c7" stroke="#000" stroke-width="0.6"/>
  <circle cx="500" cy="305" r="6" fill="#c4332a" stroke="#000" stroke-width="0.6"/>

  <!-- ===== Origin labels (below the dots, away from baseline) ===== -->
  <text x="200" y="335" class="body label blue it" text-anchor="middle" font-size="17">O_L</text>
  <text x="500" y="335" class="body label red it"  text-anchor="middle" font-size="17">O_R</text>
  <text x="200" y="354" class="body tiny gray" text-anchor="middle">effective ray origin</text>
  <text x="500" y="354" class="body tiny gray" text-anchor="middle">effective ray origin</text>

  <!-- ===== Baseline label ===== -->
  <rect x="295" y="278" width="110" height="20" fill="#ffffff" stroke="#1f3a8a" stroke-width="0.8" rx="2"/>
  <text x="350" y="293" class="body small" text-anchor="middle">
    baseline <tspan class="it">B</tspan>
  </text>

  <!-- ===== 3D point / specimen ===== -->
  <ellipse cx="350" cy="600" rx="32" ry="9" fill="#c7b49a" stroke="#000" stroke-width="0.8"/>
  <rect x="270" y="610" width="160" height="9" fill="#d9d9d9" stroke="#000" stroke-width="0.6"/>
  <text x="350" y="638" class="body label" text-anchor="middle">3D point / specimen</text>
  <text x="350" y="656" class="body small it" text-anchor="middle">X = (X, Y, Z)</text>

  <!-- ===== Reference (central pinhole) rays - dashed ===== -->
  <line x1="200" y1="305" x2="350" y2="600" class="ray-axis"/>
  <line x1="500" y1="305" x2="350" y2="600" class="ray-axis"/>

  <!-- ===== Polynomially perturbed rays (solid, slightly bent) ===== -->
  <path d="M 200 305 Q 245 430 350 600" stroke="#2a55c7" stroke-width="1.8" fill="none"/>
  <path d="M 500 305 Q 455 430 350 600" stroke="#c4332a" stroke-width="1.8" fill="none"/>

  <!-- ===== Perturbation annotations ===== -->
  <text x="240" y="450" class="body small it blue">delta_L(x,y)</text>
  <text x="395" y="450" class="body small it red">delta_R(x,y)</text>

  <!-- ===== Convergence half-angles ===== -->
  <path d="M 320 588 A 30 30 0 0 1 350 595" stroke="#2a55c7" stroke-width="1.2" fill="none"/>
  <path d="M 350 595 A 30 30 0 0 1 380 588" stroke="#c4332a" stroke-width="1.2" fill="none"/>
  <text x="312" y="582" class="body small it blue" text-anchor="end">-theta</text>
  <text x="388" y="582" class="body small it red"  text-anchor="start">+theta</text>

  <!-- ===== Object distance Z (left side) ===== -->
  <line x1="80" y1="305" x2="80" y2="600" stroke="#444" stroke-width="0.8"
        marker-start="url(#arrowBlack)" marker-end="url(#arrowBlack)"/>
  <g transform="translate(60 452) rotate(-90)">
    <text x="0" y="0" class="body small" text-anchor="middle">
      object distance <tspan class="it">Z</tspan>
    </text>
  </g>

  <!-- ===== LEGEND BOX (lower-left of schematic) ===== -->
  <g transform="translate(40 690)">
    <rect x="0" y="0" width="290" height="62" rx="4" ry="4" class="legendbox"/>
    <line x1="14" y1="22" x2="48" y2="22" class="ray-axis"/>
    <text x="56" y="26" class="body tiny">central pinhole reference ray (dashed)</text>
    <line x1="14" y1="46" x2="48" y2="46" stroke="#2a55c7" stroke-width="1.8"/>
    <text x="56" y="50" class="body tiny">channel ray with polynomial perturbation</text>
  </g>

  <!-- ===== Coordinate frame (right of legend, both inside canvas) ===== -->
  <g transform="translate(390 730)">
    <line x1="0" y1="0" x2="32" y2="0" stroke="#000" stroke-width="1.2" marker-end="url(#arrowBlack)"/>
    <line x1="0" y1="0" x2="0" y2="-32" stroke="#000" stroke-width="1.2" marker-end="url(#arrowBlack)"/>
    <text x="38" y="4"   class="body small it">x</text>
    <text x="-12" y="-30" class="body small it">y</text>
    <text x="-2" y="22" class="body tiny" text-anchor="start">main optical axis: <tspan class="it">z</tspan></text>
  </g>

  <!-- ===== RIGHT PANEL : EQUATIONS ===== -->

  <rect x="685" y="85" width="570" height="595" rx="6" ry="6" class="panelfill"/>

  <text x="970" y="113" class="body header" text-anchor="middle" fill="#1f3a8a">
    Equations - StereoComplex notation
  </text>

  <!-- Section 1 -->
  <circle cx="710" cy="138" r="11" fill="#1f3a8a"/>
  <text x="710" y="143" class="body small" text-anchor="middle" fill="#fff" font-weight="bold">1</text>
  <text x="730" y="143" class="body label" font-weight="bold" fill="#1f3a8a">Intrinsics and normalized pixel coordinates</text>

  <text x="712" y="167" class="body label it">K_c = [ [f_x,c, 0, c_x,c] ; [0, f_y,c, c_y,c] ; [0, 0, 1] ]</text>
  <text x="712" y="190" class="body label it">pi_K_c^-1 (u_c, v_c) = (x_d,c, y_d,c)</text>
  <text x="712" y="210" class="body label it">x_d,c = (u_c - c_x,c) / f_x,c,  y_d,c = (v_c - c_y,c) / f_y,c</text>

  <!-- Section 2 -->
  <circle cx="710" cy="240" r="11" fill="#1f3a8a"/>
  <text x="710" y="245" class="body small" text-anchor="middle" fill="#fff" font-weight="bold">2</text>
  <text x="730" y="245" class="body label" font-weight="bold" fill="#1f3a8a">Brown 5-parameter undistortion (per channel)</text>

  <text x="712" y="269" class="body label it">theta_dist,c = (k1,c, k2,c, p1,c, p2,c, k3,c)</text>
  <text x="712" y="289" class="body label it">(x_c, y_c) = D_Brown^-1 (x_d,c, y_d,c ; theta_dist,c)</text>
  <text x="712" y="307" class="body tiny" fill="#444">
    Iterative Picard inversion (10 iter, valid for |k1| &#8804; 0.3).
  </text>

  <!-- Section 3 -->
  <circle cx="710" cy="335" r="11" fill="#1f3a8a"/>
  <text x="710" y="340" class="body small" text-anchor="middle" fill="#fff" font-weight="bold">3</text>
  <text x="730" y="340" class="body label" font-weight="bold" fill="#1f3a8a">Low-order polynomial angular perturbation</text>

  <text x="712" y="364" class="body label it">delta_x,c (x_c, y_c) = sum_l  a^x_l,c  phi_l(x_c, y_c)</text>
  <text x="712" y="384" class="body label it">delta_y,c (x_c, y_c) = sum_l  a^y_l,c  phi_l(x_c, y_c)</text>
  <text x="712" y="402" class="body tiny" fill="#444">
    {phi_l} : monomial basis up to order 3 in (x_c, y_c).
  </text>
  <text x="712" y="418" class="body tiny" fill="#444">
    Not a Seidel/Zernike decomposition - coefficients are not interpretable
  </text>
  <text x="712" y="432" class="body tiny" fill="#444">
    as classical aberrations.
  </text>

  <!-- Section 4 -->
  <circle cx="710" cy="458" r="11" fill="#1f3a8a"/>
  <text x="710" y="463" class="body small" text-anchor="middle" fill="#fff" font-weight="bold">4</text>
  <text x="730" y="463" class="body label" font-weight="bold" fill="#1f3a8a">Pixel-to-3D-line rayfield</text>

  <text x="712" y="486" class="body label it">d_cam,c = ( x_c + delta_x,c , y_c + delta_y,c , 1 ) / norm</text>
  <text x="712" y="506" class="body label it">d_c = R_c &#183; d_cam,c</text>
  <text x="712" y="526" class="body label it">R_c (u_c, v_c) = ( O_c , d_c )</text>
  <text x="712" y="546" class="body tiny" fill="#444">
    O_c is a constant per-channel effective origin (3 free DoF in the rig).
  </text>

  <!-- Section 5 -->
  <circle cx="710" cy="572" r="11" fill="#1f3a8a"/>
  <text x="710" y="577" class="body small" text-anchor="middle" fill="#fff" font-weight="bold">5</text>
  <text x="730" y="577" class="body label" font-weight="bold" fill="#1f3a8a">Free parameters per channel</text>

  <text x="712" y="600" class="body label">
    2 (origin x, y) + 5 (Brown) + 2m (poly. perturbation) = 7 + 2m
  </text>
  <text x="712" y="620" class="body tiny" fill="#444">
    Default: m = 5 monomial terms &#8658; 17 free parameters per channel.
  </text>

  <!-- ===== Bottom row : Physical idea + Surrogate scope ===== -->

  <g transform="translate(40 770)">
    <rect x="0" y="0" width="600" height="44" rx="6" ry="6" class="ideabox"/>
    <circle cx="22" cy="22" r="11" fill="#f5d423" stroke="#000" stroke-width="0.7"/>
    <text x="22" y="26" class="body small" text-anchor="middle" font-weight="bold">!</text>
    <text x="42" y="18" class="body small" font-weight="bold">Physical idea.</text>
    <text x="42" y="34" class="body small">
      Each pixel maps to a 3D line through an effective per-channel origin O_c, with no shared optical center.
    </text>
  </g>

  <g transform="translate(660 770)">
    <rect x="0" y="0" width="595" height="44" rx="6" ry="6" class="warnbox"/>
    <text x="14" y="18" class="body small" font-weight="bold" fill="#704a00">Scope &amp; surrogate.</text>
    <text x="14" y="34" class="body small" fill="#3a2a00">
      Phenomenological. Approximates a CMO microscope or a decentered pinhole pair, no specific optical-design derivation.
    </text>
  </g>

</svg>
