[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stereocomplex"
version = "0.7.0a1"
description = "Stereo calibration + compact ray-field/mapping with CPU fallback simulator."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["stereo", "calibration", "charuco", "aruco", "computer-vision", "ray-field", "metrology"]
license = { text = "GPL-2.0-or-later" }
classifiers = [
  "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "numpy>=1.24",
  "opencv-contrib-python-headless>=4.10",
  "pillow>=10.0",
  "scipy>=1.10",
]

[project.urls]
Repository = "https://github.com/jeffwitz/StereoComplex"

[project.optional-dependencies]
notebooks = [
  "jupyterlab>=4.0",
  "nbconvert>=7.0",
  "ipykernel>=6.0",
  "matplotlib>=3.8",
]
docs = [
  "sphinx>=7.2",
  "sphinx-rtd-theme>=2.0",
  "myst-parser>=2.0",
  "sphinx-copybutton>=0.5",
  "linkify-it-py>=2.0",
  "matplotlib>=3.8",
]
dev = [
  "pytest>=7.0",
  "ruff>=0.1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
license-files = ["LICENSE", "docs/LICENSE.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PERF", "RET", "RUF"]
ignore = [
  "RUF001",  # ambiguous Unicode (string) — intentional math/French symbols
  "RUF002",  # idem (docstring)
  "RUF003",  # idem (comment)
  "E741",    # 10/10 occurrences are `O` (optical origin) — blanket ignore
]

[tool.ruff.lint.isort]
known-first-party = ["stereocomplex"]

[tool.ruff.lint.per-file-ignores]
"tests/*"      = ["E501"]            # long data literals, not meaningful
"docs/**/*.py" = ["I001", "E402"]    # pedagogical snippets, deliberate order

[tool.pytest.ini_options]
markers = [
  "integration: end-to-end process tests (may require opencv-contrib-python)",
  "slow: optimisation / BA / image-processing tests (>2 s each)",
]
addopts = ["-m", "not slow", "--strict-markers"]
filterwarnings = [
  "error::DeprecationWarning",
  "ignore::DeprecationWarning:numpy.*",
  "ignore::DeprecationWarning:scipy.*",
]
